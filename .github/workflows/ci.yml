name: ci

on:
  push:
  pull_request:

# least privilege for GITHUB_TOKEN; actions pinned to full commit SHAs (GitHub "secure use" guidance)
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - name: lint
        run: ruff check . && ruff format --check .
      - name: unit tests (no LLM needed - scripted model + fake mailer)
        working-directory: api
        run: python -m pytest -q
      - name: mutation check (tests must catch planted bugs)
        run: python scripts/mutation_check.py
      - name: compose file is valid
        run: docker compose config --quiet
      - name: api image builds
        run: docker compose build api
